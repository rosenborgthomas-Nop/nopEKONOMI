name = "nop-ekonomi-ob"
main = "src/worker.js"
compatibility_date = "2026-03-01"
workers_dev = true

# Ersätt med dina KV-id från: wrangler kv namespace create OB_SESSIONS
[[kv_namespaces]]
binding = "OB_SESSIONS"
id = "345836c96d1c4ba0a6e76ba85741bf83"
preview_id = "fa4e17d354d64cc8b02968c5d39e78ec"

[vars]
TINK_API_BASE = "https://api.tink.com"
TINK_LINK_BASE = "https://link.tink.com"
TINK_MARKET = "SE"
TINK_LOCALE = "sv_SE"
SESSION_TTL_SECONDS = "14400"
# Sätt DEMO_MODE=1 om Tink-nycklar saknas (lokal/dev)
DEMO_MODE = "0"
# PWA-callback efter BankID (GitHub Pages). Query: ?obSession=...&obError=...
PWA_RETURN_URL = "https://rosenborgthomas-nop.github.io/nopEKONOMI/nopEKONOMI.html"
